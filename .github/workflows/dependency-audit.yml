name: dependency-audit
on:
  workflow_call:
    inputs:
      platform-ref:
        description: Immutable central commit, matching the caller uses ref
        required: true
        type: string

permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate central revision
        env:
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: '[[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pascucci-labs/.github
          ref: ${{ inputs.platform-ref }}
          path: .quality-platform
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependency scanners
        run: |
          python .quality-platform/scripts/install-tools.py trivy osv-scanner
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan dependencies
        run: python .quality-platform/scripts/security.py --mode dependencies
      - name: Preserve sanitized results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependencies-results
          path: .quality-results/
          if-no-files-found: warn
          retention-days: 7
