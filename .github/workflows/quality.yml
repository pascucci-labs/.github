name: quality
on:
  workflow_call:
    inputs:
      platform-ref:
        description: Immutable central commit, matching the caller uses ref
        required: true
        type: string
      node-version:
        type: string
        default: '22'
      python-version:
        type: string
        default: '3.12'
      java-version:
        type: string
        default: '21'
      flutter-version:
        type: string
        default: '3.35.7'

permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate central revision
        env:
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: '[[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pascucci-labs/.github
          ref: ${{ inputs.platform-ref }}
          path: .quality-platform
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
      - name: Discover manifests
        id: stack
        run: |
          python .quality-platform/scripts/detect-stack.py > "$RUNNER_TEMP/stack.json"
          python - <<'PYCODE'
          import json, os
          technologies = json.load(open(os.environ['RUNNER_TEMP'] + '/stack.json'))['technologies']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('java', 'dart', 'flutter'):
                  output.write(f'{key}={str(key in technologies).lower()}\n')
          PYCODE
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.stack.outputs.java == 'true'
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        if: steps.stack.outputs.dart == 'true' || steps.stack.outputs.flutter == 'true'
        with:
          flutter-version: ${{ inputs.flutter-version }}
          cache: false
      - name: Install general tooling
        run: |
          python -m pip install 'uv==0.13.6' 'yamllint==1.37.1'
          npm install --global 'markdownlint-cli2@0.24.0' 'editorconfig-checker@7.0.0'
          python .quality-platform/scripts/install-tools.py actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run repository quality commands
        run: python .quality-platform/scripts/quality.py
      - name: Preserve sanitized results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-results
          path: .quality-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
