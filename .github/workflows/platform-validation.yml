name: Validate shared automation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: platform-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Tests and workflow lint
        run: |
          python -m unittest discover -s tests -v
          python scripts/install-tools.py actionlint
          "$HOME/.local/bin/actionlint"
      - name: Validate local Semgrep rules
        run: |
          python -m pip install 'semgrep==1.182.1'
          semgrep scan --validate --config config/semgrep --metrics=off
