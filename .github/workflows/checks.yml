name: checks
# quality.yml, security.yml and dependency-audit.yml in one job: one runner slot, one checkout and one setup per push
# instead of three (owner choice, 2026-11-10). The scans run first, on the clean checkout, before the repository's own
# quality commands install or build anything into the tree. Every step after setup runs even when an earlier one
# failed, so one run still reports all three, and the job fails if any of them did. The three single-purpose workflows
# stay for callers that have not switched.
on:
  workflow_call:
    inputs:
      platform-ref:
        description: Immutable central commit, matching the caller uses ref
        required: true
        type: string
      node-version:
        type: string
        default: '22'
      python-version:
        type: string
        default: '3.12'
      java-version:
        type: string
        default: '21'
      flutter-version:
        type: string
        default: '3.35.7'

permissions:
  contents: read
jobs:
  check:
    # GitHub-hosted unless the org variable ORG_CI_RUNNER is 'self-hosted', and then
    # only for runs on the default branch and same-repo PRs by the codev app or the owner
    # (docs/automation.md, Cost and isolation).
    runs-on: ${{ vars.ORG_CI_RUNNER == 'self-hosted' && ((github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["pascucci-labs-codev[bot]","gpascucci"]'), github.event.pull_request.user.login))) && fromJSON('["self-hosted","Linux","X64","pascucci-ci"]') || 'ubuntu-24.04' }}
    # The three jobs' limits were 25 + 20 + 20 minutes.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Full history for the commit-history secret scan.
          fetch-depth: 0
      - name: Validate central revision
        env:
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: '[[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pascucci-labs/.github
          ref: ${{ inputs.platform-ref }}
          path: .quality-platform
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install pinned scanners
        run: |
          python -m pip install 'semgrep==1.182.1'
          python .quality-platform/scripts/install-tools.py gitleaks trivy osv-scanner
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan source, commits and infrastructure
        run: python .quality-platform/scripts/security.py --mode security
      - name: Scan dependencies
        if: ${{ !cancelled() }}
        run: python .quality-platform/scripts/security.py --mode dependencies
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ !cancelled() }}
        with:
          node-version: ${{ inputs.node-version }}
      - name: Discover manifests
        id: stack
        if: ${{ !cancelled() }}
        run: |
          python .quality-platform/scripts/detect-stack.py > "$RUNNER_TEMP/stack.json"
          python - <<'PYCODE'
          import json, os
          technologies = json.load(open(os.environ['RUNNER_TEMP'] + '/stack.json'))['technologies']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('java', 'dart', 'flutter'):
                  output.write(f'{key}={str(key in technologies).lower()}\n')
          PYCODE
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: ${{ !cancelled() && steps.stack.outputs.java == 'true' }}
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        if: ${{ !cancelled() && (steps.stack.outputs.dart == 'true' || steps.stack.outputs.flutter == 'true') }}
        with:
          flutter-version: ${{ inputs.flutter-version }}
          cache: false
      - name: Install general tooling
        if: ${{ !cancelled() }}
        run: |
          python -m pip install 'uv==0.13.6' 'yamllint==1.37.1'
          npm install --global 'markdownlint-cli2@0.24.0' 'editorconfig-checker@6.2.0'
          python .quality-platform/scripts/install-tools.py actionlint
      - name: Run repository quality commands
        if: ${{ !cancelled() }}
        run: python .quality-platform/scripts/quality.py
      # quality.json, security.json and dependencies.json, as the three jobs uploaded them separately.
      - name: Preserve sanitized results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-results
          path: .quality-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
