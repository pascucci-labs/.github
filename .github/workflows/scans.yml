name: scans
# security.yml and dependency-audit.yml in one job: one runner slot, checkout and setup per push instead of two (owner
# choice, 2026-11-10). This job runs only central scanners on the checked-out tree and never executes repository code
# (no installs, builds or repository commands), so nothing the repository controls runs in the VM that produces and
# uploads the scan results. The repository's own commands stay in quality.yml, a separate job on a separate runner.
# Each scan uploads its own artifact under the name the single-purpose workflows used. The dependency scan runs even
# when the source scan failed, so one run reports both, and the job fails if either did.
on:
  workflow_call:
    inputs:
      platform-ref:
        description: Immutable central commit, matching the caller uses ref
        required: true
        type: string

permissions:
  contents: read
jobs:
  check:
    # GitHub-hosted unless the org variable ORG_CI_RUNNER is 'self-hosted', and then
    # only for runs on the default branch and same-repo PRs by the codev app or the owner
    # (docs/automation.md, Cost and isolation).
    runs-on: ${{ vars.ORG_CI_RUNNER == 'self-hosted' && ((github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["pascucci-labs-codev[bot]","gpascucci"]'), github.event.pull_request.user.login))) && fromJSON('["self-hosted","Linux","X64","pascucci-ci"]') || 'ubuntu-24.04' }}
    # The two jobs' limits were 20 + 20 minutes.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Full history for the commit-history secret scan.
          fetch-depth: 0
      - name: Validate central revision
        env:
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: '[[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pascucci-labs/.github
          ref: ${{ inputs.platform-ref }}
          path: .quality-platform
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned scanners
        run: |
          python -m pip install 'semgrep==1.182.1'
          python .quality-platform/scripts/install-tools.py gitleaks trivy osv-scanner
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan source, commits and infrastructure
        run: python .quality-platform/scripts/security.py --mode security
      - name: Preserve sanitized security results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-results
          path: .quality-results/security.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Scan dependencies
        if: ${{ !cancelled() }}
        run: python .quality-platform/scripts/security.py --mode dependencies
      - name: Preserve sanitized dependency results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependencies-results
          path: .quality-results/dependencies.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
