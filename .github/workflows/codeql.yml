name: Optional public CodeQL
on:
  workflow_call:
    inputs:
      languages:
        description: Detected CodeQL-supported languages, comma separated
        type: string
        required: true
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    # Private Code Security is deliberately not enabled or inferred from the plan.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          languages: ${{ inputs.languages }}
          build-mode: none
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279
